# Trusted Publishing: configure the matching publisher on PyPI first; see docs/PUBLISHING.md.
name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test before building
        run: |
          python selftest_wombat_gate.py
          python selftest_release.py
          bash hooks/selftest_guard.sh
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify release tag against wheel metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email, glob, os, zipfile
          wheels = glob.glob('dist/*.whl')
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as z:
              names = [n for n in z.namelist() if n.endswith('.dist-info/METADATA')]
              assert len(names) == 1, names
              metadata = email.message_from_bytes(z.read(names[0]))
          assert metadata['Name'] == 'wombat-gate', metadata['Name']
          assert os.environ['RELEASE_TAG'] == 'v' + metadata['Version'], metadata['Version']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wombat-gate/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
