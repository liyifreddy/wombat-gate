[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wombat-gate"
dynamic = ["version"]
description = "One at a time through the burrow: a git commit queue for many AI agents sharing one working tree."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "liyifreddy" }]
keywords = ["git", "multi-agent", "claude-code", "lock", "queue", "commit"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/liyifreddy/wombat-gate"
Issues = "https://github.com/liyifreddy/wombat-gate/issues"

[project.scripts]
wombat-gate = "wombat_gate:main"

[tool.hatch.version]
path = "bin/wombat-gate"

# The CLI stays one file (bin/wombat-gate); the wheel ships it as the module wombat_gate.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"bin/wombat-gate" = "wombat_gate.py"

[tool.hatch.build.targets.sdist]
include = ["bin/", "hooks/", "skills/", "README.md", "README.zh-CN.md", "DESIGN.md", "PLAYBOOK.md",
           "LICENSE", "selftest_wombat_gate.py"]
